[workspace]
authors = ["Benjamin Tovar <btovar@nd.edu>"]
channels = ["conda-forge"]
name = "cctools-dev"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
configure = "./configure --with-base-dir $CONDA_PREFIX --prefix $CONDA_PREFIX"
build = "make"
install = "make install"
test = "make test"

[dependencies]
python = ">=3.14.7,<3.15"
make = ">=4.4.1,<5"
zlib = ">=1.3.2,<2"
swig = ">=4.5.0,<5"
perl = ">=5.32.1,<5.33"
libopenssl-static = ">=3.6.3,<4"
openssl = ">=3.6.3,<4"
conda-pack = ">=0.9.2,<0.10"
packaging = ">=26.3,<27"
cloudpickle = ">=3.1.2,<4"
threadpoolctl = ">=3.6.0,<4"
prometheus_client = ">=0.26.0,<0.27"
rich = ">=15.0.0,<16"
flake8 = ">=7.3.0,<8"
clang-format = ">=22.1.8,<23"
m4 = ">=1.4.21,<2"
doxygen = ">=1.17.0,<2"
mkdocs = ">=1.6.1,<2"
pymdown-extensions = ">=11.0.1,<12"
matplotlib = ">=3.11.1,<4"
# Pinned to LLVM 22 to match the clang-tools-22 apt package CI installs
# for packaging/lint/scan-build.sh -- see that script and
# packaging/lint/scan-build-suppressions.txt's header on why the clang
# version used to generate the suppressions baseline matters.
clang-tools = ">=22.1.8,<23"
clang = ">=22.1.8,<23"

# gcc/g++/gdb are only needed (and only resolvable) on Linux; macOS builds
# use the system/Xcode compiler instead, mirroring packaging/build-conda/setup.sh.
[target.linux-64.dependencies]
gcc_linux-64 = ">=16.1.0,<17"
gxx_linux-64 = ">=16.1.0,<17"
gdb = ">=17.2,<18"
